<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Страница не найдена — Анна Щеголихина</title>
<meta name="robots" content="noindex,follow"><meta name="theme-color" content="#FFF3E3"><meta name="color-scheme" content="light only">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
:root{--cream:#FFF3E3;--rose:#D4A5A5;--lav:#B8A9C9;--ink:#4A3F45;--muted:#5c4f55}*{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse 48% 42% at 12% 15%,#b8a9c956,transparent 68%),var(--cream);color:var(--ink);font:600 16px/1.55 Nunito,system-ui,sans-serif}.grid-soft{position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(#4a3f450a 1px,transparent 1px),linear-gradient(90deg,#4a3f450a 1px,transparent 1px);background-size:80px 80px}.card{width:min(520px,100%);padding:40px 32px;border-radius:28px;background:#ffffffa6;box-shadow:0 20px 50px #9a6b7a2b;text-align:center}h1{margin:0 0 12px;font:600 2rem Literata,Georgia,serif}p{margin:0 0 22px;color:var(--muted)}.btn{display:inline-flex;min-height:44px;align-items:center;padding:10px 18px;border-radius:999px;background:linear-gradient(105deg,var(--rose),var(--lav));color:#fff;font:800 .84rem Nunito,system-ui,sans-serif;text-decoration:none}a:focus-visible{outline:2px solid #9a6b7a;outline-offset:3px}
</style>
</head>
<body>
<div class="grid-soft" aria-hidden="true"></div>
<main class="card">
  <h1>Страница не найдена</h1>
  <p>Такой страницы нет. Вернитесь на главную или напишите в мессенджер.</p>
  <a class="btn" href="/">На главную</a>
</main>
</body>
</html>
